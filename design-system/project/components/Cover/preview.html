<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Raffaello</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .red { fill:var(--accent); }
  .gold { fill:var(--yellow); }
  .deep { fill:var(--hero); }
  .grey { fill:var(--graphite); }
  .tint { fill:var(--accent-soft); }
  .dia { fill:var(--yellow); }
  .dia.cut { fill:var(--accent); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-size:76px; line-height:.92; font-weight:700; letter-spacing:.02em; color:var(--ink); }
  .tag { margin:var(--space-2) 0 0 4px; font-size:14px; line-height:20px; color:var(--muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      accent 160x264 slab bled off the top (the brand red, largest) · hero ink 176x184 bled off the right · yellow 160x16 gold bar under the slab (the logo's bar) · graphite 96x56 · accent-soft 96x96 relief — about 40% of 960x288
  arrangement one tall red slab with satellites, bottoms on one line space-6 above the edge, space-4 gutters
  pattern     diamonds, from the mark itself (the R sits in a red diamond with a gold bar): 16px rotated squares at a space-6 pitch in yellow over the ink block, three cut in accent
  scales      sides in space-4/space-6 multiples; gutters space-4; pitch space-6; block corners radius-card, bar radius-tag
-->
<rect class="red" x="16" y="-24" width="160" height="264" rx="16"/>
<rect class="gold" x="16" y="248" width="160" height="16" rx="6"/>
<rect class="tint" x="192" y="168" width="96" height="96" rx="16"/>
<rect class="grey" x="192" y="96" width="96" height="56" rx="16"/>
<rect class="deep" x="304" y="80" width="200" height="184" rx="16"/>
<g transform="translate(0 0)">
<rect class="dia" x="328" y="104" width="12" height="12" transform="rotate(45 334 110)"/>
<rect class="dia" x="352" y="104" width="12" height="12" transform="rotate(45 358 110)"/>
<rect class="dia" x="376" y="104" width="12" height="12" transform="rotate(45 382 110)"/>
<rect class="dia" x="400" y="104" width="12" height="12" transform="rotate(45 406 110)"/>
<rect class="dia" x="424" y="104" width="12" height="12" transform="rotate(45 430 110)"/>
<rect class="dia" x="448" y="104" width="12" height="12" transform="rotate(45 454 110)"/>
<rect class="dia" x="328" y="128" width="12" height="12" transform="rotate(45 334 134)"/>
<rect class="dia cut" x="352" y="128" width="12" height="12" transform="rotate(45 358 134)"/>
<rect class="dia" x="376" y="128" width="12" height="12" transform="rotate(45 382 134)"/>
<rect class="dia" x="400" y="128" width="12" height="12" transform="rotate(45 406 134)"/>
<rect class="dia" x="424" y="128" width="12" height="12" transform="rotate(45 430 134)"/>
<rect class="dia" x="448" y="128" width="12" height="12" transform="rotate(45 454 134)"/>
<rect class="dia" x="328" y="152" width="12" height="12" transform="rotate(45 334 158)"/>
<rect class="dia" x="352" y="152" width="12" height="12" transform="rotate(45 358 158)"/>
<rect class="dia" x="376" y="152" width="12" height="12" transform="rotate(45 382 158)"/>
<rect class="dia cut" x="400" y="152" width="12" height="12" transform="rotate(45 406 158)"/>
<rect class="dia" x="424" y="152" width="12" height="12" transform="rotate(45 430 158)"/>
<rect class="dia" x="352" y="176" width="12" height="12" transform="rotate(45 358 182)"/>
<rect class="dia" x="376" y="176" width="12" height="12" transform="rotate(45 382 182)"/>
<rect class="dia" x="400" y="176" width="12" height="12" transform="rotate(45 406 182)"/>
<rect class="dia cut" x="424" y="176" width="12" height="12" transform="rotate(45 430 182)"/>
<rect class="dia" x="376" y="200" width="12" height="12" transform="rotate(45 382 206)"/>
<rect class="dia" x="400" y="200" width="12" height="12" transform="rotate(45 406 206)"/>
<rect class="dia" x="400" y="224" width="12" height="12" transform="rotate(45 406 230)"/>
</g>
</svg>
</div>
<div class="words">
<h1 class="name">Raffaello</h1>
<p class="tag">Measure twice. Build once.</p>
</div>
</div>
</body>
</html>
